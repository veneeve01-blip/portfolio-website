<!DOCTYPE html>

<head>
    <title>Venesha | Portfolio</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(to right, #1f1c2c, #928dab);
            color: white;
            text-align: center;
        }

        header {
            padding: 40px;
        }

        h1 {
            font-size: 40px;
        }

        .section {
            padding: 30px;
        }

        .card {
            background: white;
            color: black;
            padding: 20px;
            margin: 15px auto;
            width: 280px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            transition: transform 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        a {
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }

        .btn {
            display: inline-block;
            margin: 10px;
            padding: 10px 20px;
            background: #ff7e5f;
            color: white;
            border-radius: 20px;
            text-decoration: none;
            transition: 0.3s;
        }

        .btn:hover {
            background: #feb47b;
        }

        .fade {
            animation: fadeIn 2s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

    </style>
</head>
